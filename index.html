<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1214">
  <meta name="color-scheme" content="dark">
  <title>Controle de Finanças</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="tabs">
      <button data-aba="casa">Casa</button>
      <button data-aba="pj">PJ</button>
    </nav>
    <div class="mes">
      <button data-act="mes-ant" aria-label="Mês anterior">‹</button>
      <span id="mes-label"></span>
      <button data-act="mes-prox" aria-label="Próximo mês">›</button>
    </div>
  </header>

  <main>
    <section id="resumo" class="hero"></section>
    <section class="card">
      <h2>Pra onde foi</h2>
      <div id="categorias"></div>
    </section>
    <section class="card">
      <h2>Lançamentos do mês</h2>
      <ul id="lista"></ul>
    </section>
    <div class="rodape">
      <button class="link" data-act="editar-cats">Editar categorias</button>
      <button class="link" data-act="toggle-pj" id="toggle-pj"></button>
      <a class="link" href="instalar.html">Como instalar · mandar pra alguém</a>
    </div>
  </main>

  <button class="fab" data-act="lancar" aria-label="Lançar gasto">+</button>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-box" id="sheet-box"></div>
  </div>

  <script type="module" src="js/app.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
