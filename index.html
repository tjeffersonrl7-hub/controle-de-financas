<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a7f5a">
  <title>Finanças</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="tabs">
      <button data-aba="casa">CASA</button>
      <button data-aba="pj">PJ</button>
    </nav>
    <div class="mes">
      <button data-act="mes-ant" aria-label="Mês anterior">‹</button>
      <span id="mes-label"></span>
      <button data-act="mes-prox" aria-label="Próximo mês">›</button>
    </div>
  </header>

  <main>
    <section id="resumo" class="card"></section>
    <button class="btn-lancar" data-act="lancar">+ LANÇAR GASTO</button>
    <section class="card">
      <h2>Pra onde foi</h2>
      <div id="categorias"></div>
    </section>
    <section class="card">
      <h2>Lançamentos do mês</h2>
      <ul id="lista"></ul>
    </section>
    <button class="link" data-act="editar-cats">Editar categorias</button>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-box" id="sheet-box"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
